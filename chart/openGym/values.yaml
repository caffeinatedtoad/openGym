replicaCount: 1

# mediaInit is used to download the exercise images and GIFs, one time (~140 MB) —
# the same download as the media service in docker-compose.yml. They are © Gym
# visual (https://gymvisual.com/), used under the exercises-dataset's terms and
# fetched from upstream, not redistributed by openGym; see NOTICE.md.
mediaInit:
  repository: "alpine/git"
  tag: "2.52.0"
  pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

# The api and web images default to the chart's appVersion, so both always run the same
# release. Set api.tag and web.tag only to pin something else, and then move them together:
# the API and the web image of one version belong together. Avoid :latest, which changes
# under a pod whenever it is rescheduled. The published tags are the version (1.3.10) and
# its minor line (1.3); see the release notes before a bump.
api:
  repository: "ghcr.io/duartesantos8/opengym-api"
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  # Everything else in .env.example (INVITE_ONLY, ADMIN_UIDS, FIRST_USER_ADMIN,
  # ALLOW_GUEST, DEFAULT_LANG, PASSWORD_LOGIN, the push keys, ...) goes here the
  # same way. FIRST_USER_ADMIN="1" makes the first profile created on an empty
  # instance its admin (off by default).
  # TRUST_PROXY is left off on purpose: the web container overwrites X-Forwarded-For
  # with the address it was reached from, which here is the gateway's pod, so turning
  # it on changes nothing for the sign-in throttle — while any pod in the cluster that
  # talks to port 3000 directly could then choose its own address. See
  # docs/SELF_HOSTING_KUBERNETES.md.
  extraEnv: []
  port: 3000
  dataDir: /data
  rpID: opengym.example.com
  origin: https://opengym.example.com
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

web:
  repository: "ghcr.io/duartesantos8/opengym-web"
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  extraEnv: []
  nginxPort: "80"
  port: "3000"
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

volumes:
  data:
    name: opengym-data
    claimSize: 2Gi
  media:
    name: opengym-media
    claimSize: 2Gi

imagePullSecrets: []

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
# The route's hostname is api.rpID, the same host passkeys are bound to.
httpRoute:
  enabled: false
  # The Gateway(s) this route attaches to; these are your cluster's, not the chart's.
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  # Secret holding the TLS certificate for api.rpID.
  tlsSecret: opengym-tls
  # Have cert-manager issue tlsSecret.
  certManager:
    enabled: false
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt
  # Let a Gateway in another namespace read tlsSecret. Not needed when the Gateway's
  # listener carries its own (e.g. wildcard) certificate.
  referenceGrant:
    enabled: false
    gatewayNamespace: envoy-gateway-system

nodeSelector: {}
tolerations: []
affinity: {}
